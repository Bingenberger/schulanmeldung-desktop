# SL-Office hinter nginx.
#
# Vorlage: <DOMAIN> durch den tatsächlichen Namen ersetzen und die Datei nach
# /etc/nginx/sites-available/sl-office kopieren, dann verlinken:
#   sudo ln -s /etc/nginx/sites-available/sl-office /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sicherheits-Kopfzeilen (CSP, HSTS, X-Frame-Options …) setzt die Anwendung
# selbst in security.py. Sie hier zu wiederholen, würde sie doppelt ausliefern.

# Schutz für die öffentlichen Seiten des Elternportals: Aktivierung und
# Anmeldelink sind ohne Login erreichbar. Die Grenzen sind bewusst großzügig,
# eine Familie stößt im Alltag nicht daran.
limit_req_zone $binary_remote_addr zone=sl_office_login:10m rate=20r/m;

upstream sl_office {
    server 127.0.0.1:5000 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # Erneuerung der Zertifikate muss unverschlüsselt erreichbar bleiben.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Muss zu SL_OFFICE_MAX_UPLOAD_BYTES passen (Vorgabe 10 MB) und etwas
    # Luft für den Formularrahmen lassen, sonst bricht nginx den Upload ab,
    # bevor die Anwendung eine verständliche Meldung zeigen kann.
    client_max_body_size 12m;
    client_body_timeout 60s;

    access_log /var/log/nginx/sl-office.access.log;
    error_log  /var/log/nginx/sl-office.error.log;

    location / {
        proxy_pass http://sl_office;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_redirect off;

        # PDF-Erzeugung für viele Kinder darf dauern.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # Zugangsaktivierung und Anmeldelink der Eltern sowie die Personalanmeldung.
    location ~ ^/(eltern/(aktivieren|link-anfordern)|login) {
        limit_req zone=sl_office_login burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://sl_office;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_redirect off;
    }

    # Kalenderdateien werden als Anhang geliefert; nichts davon zwischenspeichern.
    location = /favicon.ico { access_log off; log_not_found off; }
}
