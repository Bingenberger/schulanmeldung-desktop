{% extends 'base.html' %}
{% block content %}
<div class="mx-auto" style="max-width: 42rem">
  <h1>Elternzugang aktivieren</h1>
  <p>Hinterlegen Sie Ihre eigene E-Mail-Adresse. Für ein Kind können höchstens zwei Elternzugänge bestehen.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Ihr Name</label><input class="form-control" name="display_name" required maxlength="200"></div>
    <div class="mb-3"><label class="form-label">Ihre E-Mail-Adresse</label><input class="form-control" type="email" name="email" required maxlength="320"></div>
    <button class="btn btn-primary">Zugang aktivieren</button>
  </form>
</div>
{% endblock %}
